name: 问题报告
description: 报告本重写项目中可复现的问题。
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请不要在 Issue 里追加仓库外的原版游戏文件、资源、存档、截图或其他未登记内容；报告应引用仓库内资源清单中的基线。
  - type: input
    id: platform
    attributes:
      label: 运行平台
      description: 请填写操作系统、架构，以及构建版本或提交。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小输入序列或逻辑回放；用资源清单中的路径和基线 ID 标明受影响资源。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际行为
    validations:
      required: true
