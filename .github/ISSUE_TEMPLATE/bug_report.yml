name: Bug report
description: Report a reproducible issue in the reimplementation.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请不要在 Issue 里追加仓库外的原版游戏文件、资源、存档、截图或其他未登记内容；报告应引用仓库内资源清单中的基线。
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, architecture, and build or commit.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal input sequence or logical replay; identify affected assets by their manifest paths and baseline ID.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
