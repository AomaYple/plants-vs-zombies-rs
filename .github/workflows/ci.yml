name: 持续集成（CI）

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    name: 仓库结构检查
    runs-on: ubuntu-latest
    outputs:
      has_packages: ${{ steps.metadata.outputs.has_packages }}
      has_app: ${{ steps.metadata.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 检查 Web 启动状态回归
        run: node --experimental-vm-modules --test web/startup.test.mjs
      - name: 安装工作流检查工具
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          actionlint_dir="${RUNNER_TEMP}/actionlint"
          actionlint_archive="${actionlint_dir}/actionlint.tar.gz"
          mkdir -p "$actionlint_dir"
          curl --fail --silent --show-error --location --retry 3 --output "$actionlint_archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" | sha256sum --check --strict
          tar -xzf "$actionlint_archive" -C "$actionlint_dir" actionlint
          "$actionlint_dir/actionlint" -version
          printf '%s\n' "$actionlint_dir" >> "$GITHUB_PATH"
      - name: 检查工作流语法
        run: actionlint .github/workflows/ci.yml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: 检查 workspace 元数据
        id: metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--locked", "--format-version", "1"], text=True
          ))
          has_packages = str(bool(metadata["workspace_members"])).lower()
          has_app = str(any(package["name"] == "pvz-app" for package in metadata["packages"])).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_packages={has_packages}\n")
              output.write(f"has_app={has_app}\n")
          print(f"workspace 成员数：{len(metadata['workspace_members'])}")
          PY
      - name: 检查跟踪文本格式与资源清单
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path, PurePosixPath

          binary_suffixes = {
              ".png", ".jpg", ".jpeg", ".gif", ".ogg", ".mo3", ".au",
              ".pak", ".exe", ".dll", ".compiled",
          }
          executable_suffixes = {".exe", ".dll", ".dmp"}
          text_asset_suffixes = {".xml", ".reanim", ".txt", ".trail", ".jsfl"}
          binary_asset_suffixes = binary_suffixes - executable_suffixes - {".pak"}
          tracked = list(filter(None, subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode("utf-8").split("\0")))
          support = json.loads(Path("assets/third-party/manifest.json").read_text(encoding="utf-8"))
          if support["schema_version"] != 1:
              raise SystemExit("不支持的第三方资源清单版本")
          support_records = {}
          for record in support["files"]:
              path = record["path"]
              name = "assets/third-party/" + path
              if PurePosixPath(path).name != path or "\\" in path or ":" in path or PurePosixPath(path).suffix != ".ttf" or name in support_records:
                  raise SystemExit("无效或重复的第三方字体路径")
              if record["license"] != "OFL-1.1" or not record["source_url"].startswith("https://"):
                  raise SystemExit("第三方字体缺少许可或来源")
              if type(record["size"]) is not int or record["size"] <= 0 or len(record["sha256"]) != 64 or any(c not in "0123456789abcdef" for c in record["sha256"]):
                  raise SystemExit("无效的第三方资源大小或指纹")
              support_records[name] = record
          tracked_fonts = {name for name in tracked if Path(name).suffix.lower() == ".ttf"}
          if tracked_fonts != set(support_records):
              raise SystemExit("跟踪字体与第三方资源清单不一致")
          manifest_path = Path("assets/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest["schema_version"] != 1 or manifest["root"] != "assets/original":
              raise SystemExit("不支持的资源清单格式版本或根目录")
          records = {record["path"]: record for record in manifest["files"]}
          if len(records) != len(manifest["files"]):
              raise SystemExit("资源清单中存在重复路径")
          if len({path.casefold() for path in records}) != len(records):
              raise SystemExit("资源清单路径存在大小写碰撞")
          for path, record in records.items():
              relative = PurePosixPath(path)
              if relative.is_absolute() or ".." in relative.parts or "\\" in path or ":" in path or relative.as_posix() != path:
                  raise SystemExit(f"无效的资源路径：{path}")
              if record["kind"] not in {"text", "binary", "package"}:
                  raise SystemExit(f"不支持的资源类型：{path}")
              if relative.suffix.lower() in executable_suffixes:
                  raise SystemExit(f"资源清单中存在可执行文件或转储文件：{path}")
              if record["kind"] == "package":
                  classified = path == "main.pak"
              elif record["kind"] == "binary":
                  classified = relative.suffix.lower() in binary_asset_suffixes
              else:
                  classified = relative.suffix.lower() in text_asset_suffixes
              if not classified:
                  raise SystemExit(f"资源分类与文件类型不一致：{path}")
              for key in ("sha256", "source_sha256"):
                  value = record[key]
                  if len(value) != 64 or any(char not in "0123456789abcdef" for char in value):
                      raise SystemExit(f"无效的 {key}：{path}")
              for key in ("size", "source_size"):
                  if type(record[key]) is not int or record[key] < 0:
                      raise SystemExit(f"无效的 {key}：{path}")
              if record["kind"] in {"binary", "package"}:
                  if record["size"] != record["source_size"] or record["sha256"] != record["source_sha256"]:
                      raise SystemExit(f"二进制资源与来源不一致：{path}")
              elif record.get("source_encoding") not in {"UTF-8", "UTF-8-BOM", "UTF-16LE-BOM"}:
                  raise SystemExit(f"不支持的来源编码：{path}")
          package = manifest["package"]
          archive = manifest["source_archive"]
          package_record = records[package["path"]]
          if package_record["kind"] != "package" or sum(record["kind"] == "package" for record in records.values()) != 1:
              raise SystemExit("应当且只能登记一个参考资源包")
          if package["entry_count"] != len(records) - 1:
              raise SystemExit("资源包条目数与解包资源数不一致")
          if archive["name"] != package["path"] or not 8 <= package["index_bytes"] < package["size"]:
              raise SystemExit("无效的参考资源包元数据")
          for key in ("size", "sha256"):
              if package[key] != package_record[key] or archive[key] != package_record["source_" + key]:
                  raise SystemExit(f"参考资源包元数据不一致：{key}")
          allowed_assets = set(records)
          tracked_assets = {p.removeprefix("assets/original/") for p in tracked if p.startswith("assets/original/")}
          if tracked_assets != allowed_assets:
              raise SystemExit("assets/original 文件集合与 assets/manifest.json 不一致")
          forbidden = [
              p for p in tracked
              if Path(p).suffix.lower() in executable_suffixes
              or (Path(p).suffix.lower() in binary_suffixes and not p.startswith("assets/original/"))
          ]
          if forbidden:
              raise SystemExit("禁止跟踪未登记的游戏载荷文件：\n" + "\n".join(forbidden))
          for name in tracked:
              data = Path(name).read_bytes()
              if name in support_records:
                  record = support_records[name]
                  if len(data) != record["size"] or hashlib.sha256(data).hexdigest() != record["sha256"]:
                      raise SystemExit(f"第三方资源大小或哈希不匹配：{name}")
                  continue
              asset_path = name.removeprefix("assets/original/") if name.startswith("assets/original/") else None
              if asset_path is not None:
                  record = records[asset_path]
                  if len(data) != record["size"] or hashlib.sha256(data).hexdigest() != record["sha256"]:
                      raise SystemExit(f"资源大小或哈希不匹配：{name}")
                  if record["kind"] in {"binary", "package"}:
                      continue
              if data.startswith(b"\xef\xbb\xbf"):
                  raise SystemExit(f"发现 UTF-8 BOM：{name}")
              if b"\r" in data:
                  raise SystemExit(f"发现 CRLF 或 CR：{name}")
              try:
                  data.decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise SystemExit(f"跟踪文本不是 UTF-8：{name}：{exc}") from exc
              if data and not data.endswith(b"\n"):
                  raise SystemExit(f"缺少文件末尾换行：{name}")
              if asset_path is None:
                  for line_number, line in enumerate(data.split(b"\n"), start=1):
                      if line.endswith((b" ", b"\t")):
                          raise SystemExit(f"存在尾随空白：{name}:{line_number}")
          print(f"已检查 {len(tracked)} 个跟踪文件；清单覆盖 {len(allowed_assets)} 个参考资源")
          PY

  implementation:
    needs: structure
    if: ${{ needs.structure.outputs.has_packages == 'true' }}
    name: Rust 实现检查
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 设置 macOS 测试临时目录
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # macOS 默认临时目录经过系统符号链接；资源测试使用 runner 的真实临时目录。
          test_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          printf 'TMPDIR=%s\n' "$test_temp" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: 缓存 Cargo registry 与 Git checkout
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}-implementation-registry-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}-implementation-registry-v1
      - name: 安装 Linux 音频构建依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - name: 检查代码
        run: cargo check --workspace --all-targets --locked
      - name: 检查格式
        run: cargo fmt --all -- --check
      - name: 运行测试
        run: cargo test --workspace --locked
      - name: 运行 Clippy 检查
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: 构建文档
        run: cargo doc --workspace --no-deps --locked
      - name: 运行 Windows 后台无资源绘制冒烟
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: cargo run -p pvz-app --locked -- --probe --smoke 30 --screenshot
      - name: 运行 Windows 后台登记资源切片冒烟
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: cargo run -p pvz-app --locked -- --smoke 30 --slice-smoke --screenshot
      - name: 验证 Windows 失败冒烟的原生进程退出码
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & ./target/debug/pvz-app.exe --failure-smoke --smoke 400 --screenshot
          if ($LASTEXITCODE -ne 0) {
            throw "失败冒烟应在期限内观察到开发关卡失败并成功退出"
          }
          & ./target/debug/pvz-app.exe --failure-smoke --smoke 2
          if ($LASTEXITCODE -eq 0) {
            throw "失败冒烟期限过短时必须以非零进程退出码报告错误"
          }
          exit 0
      - name: 验证全部兼容 feature
        if: runner.os == 'Linux'
        run: |
          cargo check --workspace --all-targets --all-features --locked
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo doc --workspace --all-features --no-deps --locked

  dependency-audit:
    needs: structure
    if: ${{ needs.structure.outputs.has_packages == 'true' }}
    name: 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: 审计锁定依赖
        run: cargo deny check

  coverage:
    needs: structure
    if: ${{ needs.structure.outputs.has_packages == 'true' }}
    name: 覆盖率与基准入口
    strategy:
      matrix:
        features: [default, all]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview
      - name: 缓存 Cargo registry 与 Git checkout
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}-coverage-${{ matrix.features }}-registry-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}-coverage-${{ matrix.features }}-registry-v1
      - name: 安装音频构建依赖
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: 生成覆盖率报告
        env:
          FEATURE_SET: ${{ matrix.features }}
        shell: bash
        run: |
          export CARGO_TARGET_DIR="${RUNNER_TEMP}/pvz-coverage-${FEATURE_SET}"
          rm -rf "$CARGO_TARGET_DIR" target/coverage
          mkdir -p target/coverage
          feature_args=()
          if [[ "$FEATURE_SET" == "all" ]]; then
            feature_args+=(--all-features)
          fi
          cargo llvm-cov clean --workspace --locked
          cargo llvm-cov --workspace --locked "${feature_args[@]}" --no-report
          cargo llvm-cov report --lcov --output-path target/coverage/lcov.info
          cargo llvm-cov report --json --output-path target/coverage/coverage.json
      - name: 保存覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.features }}
          path: target/coverage/
      - name: 编译基准场景
        if: matrix.features == 'default'
        run: cargo bench --workspace --locked --no-run

  web-build:
    needs: structure
    if: ${{ needs.structure.outputs.has_app == 'true' }}
    name: Web 应用构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - name: 缓存 Cargo registry 与 Git checkout
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}-web-registry-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}-web-registry-v1
      - name: 构建 app 的 WebAssembly
        run: cargo build -p pvz-app --target wasm32-unknown-unknown --release --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - name: 生成默认 Web 包
        run: wasm-bindgen --target web --out-name pvz_app --out-dir target/web target/wasm32-unknown-unknown/release/pvz-app.wasm
      - name: 构建无资源 Web 探针
        run: cargo build -p pvz-app --target wasm32-unknown-unknown --release --features probe --locked
      - name: 生成无资源 Web 探针包
        run: wasm-bindgen --target web --out-name pvz_app --out-dir target/web-probe target/wasm32-unknown-unknown/release/pvz-app.wasm
