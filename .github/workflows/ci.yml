name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    name: Workspace structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Check metadata
        run: cargo metadata --no-deps --format-version 1
      - name: Check whitespace
        run: git diff --check
      - name: Check tracked text encoding and payload policy
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          binary_suffixes = {
              ".png", ".jpg", ".jpeg", ".gif", ".ogg", ".mo3", ".au",
              ".pak", ".pvzpack", ".exe", ".dll", ".compiled",
          }
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden = [p for p in tracked if Path(p).suffix.lower() in binary_suffixes]
          if forbidden:
              raise SystemExit("tracked game payload files are forbidden:\n" + "\n".join(forbidden))
          for name in tracked:
              data = Path(name).read_bytes()
              if data.startswith(b"\xef\xbb\xbf"):
                  raise SystemExit(f"UTF-8 BOM found: {name}")
              if b"\r" in data:
                  raise SystemExit(f"CRLF or CR found: {name}")
              try:
                  data.decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise SystemExit(f"non-UTF-8 tracked text: {name}: {exc}") from exc
          print(f"checked {len(tracked)} tracked UTF-8/LF files")

  # Enable package compilation, tests, docs and cargo-deny when the first
  # Cargo package is registered. Keeping this job explicit prevents an empty
  # workspace from pretending that game code already exists.
  implementation:
    if: ${{ hashFiles('crates/**/Cargo.toml', 'tools/**/Cargo.toml') != '' }}
    name: Rust implementation
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Documentation
        run: cargo doc --workspace --no-deps
