name: 持续集成（CI）

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    name: 仓库结构检查
    runs-on: ubuntu-latest
    outputs:
      has_packages: ${{ steps.metadata.outputs.has_packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: 检查 workspace 元数据
        id: metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"], text=True
          ))
          has_packages = str(bool(metadata["workspace_members"])).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_packages={has_packages}\n")
          print(f"workspace 成员数：{len(metadata['workspace_members'])}")
          PY
      - name: 检查跟踪文本格式与资源清单
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path, PurePosixPath

          binary_suffixes = {
              ".png", ".jpg", ".jpeg", ".gif", ".ogg", ".mo3", ".au",
              ".pak", ".exe", ".dll", ".compiled",
          }
          executable_suffixes = {".exe", ".dll", ".dmp"}
          text_asset_suffixes = {".xml", ".reanim", ".txt", ".trail", ".jsfl"}
          binary_asset_suffixes = binary_suffixes - executable_suffixes - {".pak"}
          tracked = list(filter(None, subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode("utf-8").split("\0")))
          manifest_path = Path("assets/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest["schema_version"] != 1 or manifest["root"] != "assets/original":
              raise SystemExit("不支持的资源清单格式版本或根目录")
          records = {record["path"]: record for record in manifest["files"]}
          if len(records) != len(manifest["files"]):
              raise SystemExit("资源清单中存在重复路径")
          if len({path.casefold() for path in records}) != len(records):
              raise SystemExit("资源清单路径存在大小写碰撞")
          for path, record in records.items():
              relative = PurePosixPath(path)
              if relative.is_absolute() or ".." in relative.parts or "\\" in path or ":" in path or relative.as_posix() != path:
                  raise SystemExit(f"无效的资源路径：{path}")
              if record["kind"] not in {"text", "binary", "package"}:
                  raise SystemExit(f"不支持的资源类型：{path}")
              if relative.suffix.lower() in executable_suffixes:
                  raise SystemExit(f"资源清单中存在可执行文件或转储文件：{path}")
              if record["kind"] == "package":
                  classified = path == "main.pak"
              elif record["kind"] == "binary":
                  classified = relative.suffix.lower() in binary_asset_suffixes
              else:
                  classified = relative.suffix.lower() in text_asset_suffixes
              if not classified:
                  raise SystemExit(f"资源分类与文件类型不一致：{path}")
              for key in ("sha256", "source_sha256"):
                  value = record[key]
                  if len(value) != 64 or any(char not in "0123456789abcdef" for char in value):
                      raise SystemExit(f"无效的 {key}：{path}")
              for key in ("size", "source_size"):
                  if type(record[key]) is not int or record[key] < 0:
                      raise SystemExit(f"无效的 {key}：{path}")
              if record["kind"] in {"binary", "package"}:
                  if record["size"] != record["source_size"] or record["sha256"] != record["source_sha256"]:
                      raise SystemExit(f"二进制资源与来源不一致：{path}")
              elif record.get("source_encoding") not in {"UTF-8", "UTF-8-BOM", "UTF-16LE-BOM"}:
                  raise SystemExit(f"不支持的来源编码：{path}")
          package = manifest["package"]
          archive = manifest["source_archive"]
          package_record = records[package["path"]]
          if package_record["kind"] != "package" or sum(record["kind"] == "package" for record in records.values()) != 1:
              raise SystemExit("应当且只能登记一个参考资源包")
          if package["entry_count"] != len(records) - 1:
              raise SystemExit("资源包条目数与解包资源数不一致")
          if archive["name"] != package["path"] or not 8 <= package["index_bytes"] < package["size"]:
              raise SystemExit("无效的参考资源包元数据")
          for key in ("size", "sha256"):
              if package[key] != package_record[key] or archive[key] != package_record["source_" + key]:
                  raise SystemExit(f"参考资源包元数据不一致：{key}")
          allowed_assets = set(records)
          tracked_assets = {p.removeprefix("assets/original/") for p in tracked if p.startswith("assets/original/")}
          if tracked_assets != allowed_assets:
              raise SystemExit("assets/original 文件集合与 assets/manifest.json 不一致")
          forbidden = [
              p for p in tracked
              if Path(p).suffix.lower() in executable_suffixes
              or (Path(p).suffix.lower() in binary_suffixes and not p.startswith("assets/original/"))
          ]
          if forbidden:
              raise SystemExit("禁止跟踪未登记的游戏载荷文件：\n" + "\n".join(forbidden))
          for name in tracked:
              data = Path(name).read_bytes()
              asset_path = name.removeprefix("assets/original/") if name.startswith("assets/original/") else None
              if asset_path is not None:
                  record = records[asset_path]
                  if len(data) != record["size"] or hashlib.sha256(data).hexdigest() != record["sha256"]:
                      raise SystemExit(f"资源大小或哈希不匹配：{name}")
                  if record["kind"] in {"binary", "package"}:
                      continue
              if data.startswith(b"\xef\xbb\xbf"):
                  raise SystemExit(f"发现 UTF-8 BOM：{name}")
              if b"\r" in data:
                  raise SystemExit(f"发现 CRLF 或 CR：{name}")
              try:
                  data.decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise SystemExit(f"跟踪文本不是 UTF-8：{name}：{exc}") from exc
              if data and not data.endswith(b"\n"):
                  raise SystemExit(f"缺少文件末尾换行：{name}")
              if asset_path is None:
                  for line_number, line in enumerate(data.split(b"\n"), start=1):
                      if line.endswith((b" ", b"\t")):
                          raise SystemExit(f"存在尾随空白：{name}:{line_number}")
          print(f"已检查 {len(tracked)} 个跟踪文件；清单覆盖 {len(allowed_assets)} 个参考资源")
          PY

  implementation:
    needs: structure
    if: ${{ needs.structure.outputs.has_packages == 'true' }}
    name: Rust 实现检查
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: 检查代码
        run: cargo check --workspace --all-targets --locked
      - name: 检查格式
        run: cargo fmt --all -- --check
      - name: 运行测试
        run: cargo test --workspace --locked
      - name: 运行 Clippy 检查
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: 构建文档
        run: cargo doc --workspace --no-deps --locked

  dependency-audit:
    needs: structure
    if: ${{ needs.structure.outputs.has_packages == 'true' }}
    name: 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
