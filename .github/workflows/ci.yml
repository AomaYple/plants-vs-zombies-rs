name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    name: Workspace structure
    runs-on: ubuntu-latest
    outputs:
      has_packages: ${{ steps.metadata.outputs.has_packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Check metadata
        id: metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"], text=True
          ))
          has_packages = str(bool(metadata["workspace_members"])).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_packages={has_packages}\n")
          print(f"workspace members: {len(metadata['workspace_members'])}")
          PY
      - name: Check tracked text format and payload policy
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          binary_suffixes = {
              ".png", ".jpg", ".jpeg", ".gif", ".ogg", ".mo3", ".au",
              ".pak", ".pvzpack", ".exe", ".dll", ".compiled",
          }
          tracked = list(filter(None, subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode("utf-8").split("\0")))
          forbidden = [p for p in tracked if Path(p).suffix.lower() in binary_suffixes]
          if forbidden:
              raise SystemExit("tracked game payload files are forbidden:\n" + "\n".join(forbidden))
          for name in tracked:
              data = Path(name).read_bytes()
              if data.startswith(b"\xef\xbb\xbf"):
                  raise SystemExit(f"UTF-8 BOM found: {name}")
              if b"\r" in data:
                  raise SystemExit(f"CRLF or CR found: {name}")
              try:
                  data.decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise SystemExit(f"non-UTF-8 tracked text: {name}: {exc}") from exc
              if data and not data.endswith(b"\n"):
                  raise SystemExit(f"missing final newline: {name}")
              for line_number, line in enumerate(data.split(b"\n"), start=1):
                  if line.endswith((b" ", b"\t")):
                      raise SystemExit(f"trailing whitespace: {name}:{line_number}")
          print(f"checked {len(tracked)} tracked UTF-8/LF/no-BOM files and whitespace")
          PY

  # This implementation template is skipped for the empty workspace.
  # At first package registration, complete CONTRIBUTING.md's acceptance:
  # install/run dependency audit and applicable coverage/benchmarks, and
  # validate the effective target/feature matrix. The template is not that proof.
  implementation:
    needs: structure
    if: ${{ needs.structure.outputs.has_packages == 'true' }}
    name: Rust implementation
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
