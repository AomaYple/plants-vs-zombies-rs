[workspace]
resolver = "3"
# 只注册已有源码入口和验收目的的 package。
members = [
    "crates/pvz-data",
    "crates/pvz-core",
    "crates/pvz-assets",
    "crates/pvz-app",
    "tools/pvz-asset-tool",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["plants-vs-zombies-rs 贡献者"]
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
criterion = "0.5"
bevy = { version = "=0.20.0", default-features = false, features = [
    "std", "async_executor", "bevy_asset", "bevy_log", "bevy_winit",
    "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render",
    "bevy_mesh", "bevy_camera", "bevy_color", "bevy_image", "bevy_text",
    "bevy_audio", "vorbis", "png", "jpeg", "multi_threaded", "webgl2", "x11",
    "complex_script_segmentation",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lewton = "0.10.2"
gloo-net = { version = "0.7.0", default-features = false, features = ["http"] }
oorandom = "=11.1.5"
quick-xml = "0.41"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"

[workspace.metadata.project]
name = "plants-vs-zombies-rs"
stage = "development-slice-validated"
design = "docs/superpowers/specs/2026-10-07-repository-and-runtime-design.md"
plan = "docs/superpowers/plans/2026-10-07-foundation-and-asset-audit.md"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_assignments = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
