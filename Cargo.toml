[workspace]
resolver = "3"
# 只注册已有源码入口和验收目的的 package。
members = [
    "crates/pvz-data",
    "crates/pvz-core",
    "crates/pvz-assets",
    "tools/pvz-asset-tool",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["plants-vs-zombies-rs 贡献者"]
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
criterion = "0.5"
oorandom = "=11.1.5"
quick-xml = "0.41"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"

[workspace.metadata.project]
name = "plants-vs-zombies-rs"
stage = "rust-foundation-and-reference-assets"
design = "docs/superpowers/specs/2026-10-07-repository-and-runtime-design.md"
plan = "docs/superpowers/plans/2026-10-07-foundation-and-asset-audit.md"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_assignments = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
